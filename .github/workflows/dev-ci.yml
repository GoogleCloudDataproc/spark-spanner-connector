name: Build and Publish
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 8 and 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: |
            8
            17
          distribution: 'temurin'
          check-latest: false
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build for Spark 3.1
        run: |
          mvn -B -e install -P3.1 -DskipTests
      - name: Build for Spark 3.2
        run: |
          mvn -B -e install -P3.2 -DskipTests
      - name: Build for Spark 3.3
        run: |
          mvn -B -e install -P3.3 -DskipTests
      - name: Build for Spark 3.5
        run: |
          mvn -B -e install -P3.5 -DskipTests
      - name: Build for Spark 4.0
        run: |
          mvn -B -e install -P4.0 -DskipTests
      - name: Build for Spark 4.1
        run: |
          mvn -B -e install -P4.1 -DskipTests
      - name: Build for Spark 4.2
        run: |
          mvn -B -e install -P4.2 -DskipTests
      - name: Get short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Stage artifacts
        run: |
          mkdir shaded-jars
          for file in spark-3.*/target/spark-3.*.jar; do
            if [[ "$file" == *"lib"* || "$file" == *"original"* ]]; then
              continue
            fi
            cp "$file" shaded-jars/
          done
          for file in spark-4.*/target/spark-4.*.jar; do
            if [[ "$file" == *"lib"* || "$file" == *"original"* ]]; then
              continue
            fi
            cp "$file" shaded-jars/
          done
      - name: Upload Shaded JARs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shaded-spark-spanner-jars-${{ steps.vars.outputs.sha_short }}
          path: shaded-jars/
